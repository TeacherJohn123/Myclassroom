<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級公告專區 - 家長專用</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 Firebase 核心 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .text-5xl-custom {
      font-size: 2.2rem !important;
      line-height: 1.5 !important;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-gray-800 flex flex-col md:flex-row">

  <!-- 左側導覽列 (只留聯絡簿與行事曆) -->
  <aside class="w-full md:w-64 bg-slate-900 text-white p-5 flex flex-col justify-between shrink-0 shadow-lg">
    <div>
      <div class="mb-6">
        <h1 class="text-xl font-extrabold flex items-center gap-2">🏫 班級公告欄</h1>
        <span class="inline-block bg-sky-500/20 border border-sky-400/40 text-sky-200 text-xs px-2.5 py-1 rounded mt-2 font-bold">
          📢 家長專用檢視模式
        </span>
      </div>

      <nav class="space-y-2">
        <button onclick="switchTab('contactbook')" id="btn-contactbook" class="nav-btn w-full text-left p-3 rounded-xl bg-sky-600 font-bold flex items-center gap-2.5 transition shadow">📖 每日聯絡簿</button>
        <button onclick="switchTab('calendar')" id="btn-calendar" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-slate-800 text-slate-300 font-bold flex items-center gap-2.5 transition">📅 班級行事曆</button>
      </nav>
    </div>
    <div class="text-xs text-slate-500 border-t border-slate-800 pt-4 mt-6">
      親師雲端同步系統 v4.0
    </div>
  </aside>

  <!-- 主內容區 -->
  <main class="flex-1 p-4 md:p-8 overflow-y-auto max-w-4xl mx-auto w-full">
    
    <!-- 分頁 1：每日聯絡簿 (唯讀檢視) -->
    <section id="tab-contactbook" class="tab-content active space-y-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-4 gap-3">
        <h2 class="text-2xl font-black text-slate-800">📖 今日聯絡事項與作業</h2>
        <div class="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl border shadow-sm">
          <label class="font-bold text-gray-600 text-sm">日期：</label>
          <input type="date" id="cbDate" onchange="onDateChange()" class="border-0 font-bold text-blue-600 text-base outline-none bg-transparent cursor-pointer" />
        </div>
      </div>
      
      <div class="space-y-4">
        <!-- 當日行事曆事件提醒 -->
        <div id="todayEventsBox" class="p-4 bg-amber-50 border-2 border-amber-300 rounded-2xl text-amber-950 hidden shadow-sm">
          <div class="font-bold flex items-center gap-2 mb-1 text-base text-amber-900">
            <span>📌 今日重要日程提醒：</span>
          </div>
          <ul id="todayEventsList" class="list-disc list-inside space-y-1 text-amber-950 font-extrabold text-xl"></ul>
        </div>

        <!-- 聯絡簿內容顯示框 -->
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-200">
          <div id="cbContentDisplay" class="text-5xl-custom font-bold text-gray-900 whitespace-pre-wrap leading-relaxed">
            載入中或當日尚無聯絡事項...
          </div>
        </div>
      </div>

      <!-- 歷史紀錄列表 (方便家長查看過去幾天) -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
        <h3 class="font-bold text-base mb-4 text-gray-800 flex items-center gap-2">🗂️ 歷史聯絡簿快速檢視</h3>
        <div id="cbHistoryList" class="divide-y divide-gray-100 max-h-60 overflow-y-auto pr-1">
          <p class="text-gray-400 text-sm py-2">目前沒有歷史紀錄</p>
        </div>
      </div>
    </section>

    <!-- 分頁 2：班級行事曆 (唯讀檢視) -->
    <section id="tab-calendar" class="tab-content space-y-6">
      <div class="flex justify-between items-center border-b pb-4">
        <h2 class="text-2xl font-black text-slate-800">📅 班級行事曆總覽</h2>
        <span id="eventCount" class="text-xs bg-amber-100 text-amber-900 font-bold px-3 py-1.5 rounded-full">共 0 筆事件</span>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
        <div id="calendarList" class="divide-y divide-gray-100">
          <p class="text-gray-400 text-sm py-4 text-center">尚未有行事曆事件。</p>
        </div>
      </div>
    </section>

  </main>

  <!-- 核心 JS 邏輯 (唯讀 Firebase 同步) -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB7k5cMv5hgHZ_LCAKjXo8EuYMVdL5x3so",
      authDomain: "class-tools-49588.firebaseapp.com",
      databaseURL: "https://class-tools-49588-default-rtdb.firebaseio.com",
      projectId: "class-tools-49588",
      storageBucket: "class-tools-49588.firebasestorage.app",
      messagingSenderId: "126467689374",
      appId: "1:126467689374:web:140f12f8830ab4eee9e48f",
      measurementId: "G-GBLFFGWKR7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let appState = {};

    window.onload = function() {
      // 即時從 Firebase 雲端讀取資料
      db.ref('classroom_data').on('value', (snapshot) => {
        appState = snapshot.val() || {};
        initTodayDate();
        renderHistoryList();
        renderCalendarList();
        checkTodayEvents();
      });
    };

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.className = "nav-btn w-full text-left p-3 rounded-xl hover:bg-slate-800 text-slate-300 font-bold flex items-center gap-2.5 transition";
      });

      document.getElementById('tab-' + tabId).classList.add('active');
      document.getElementById('btn-' + tabId).className = "nav-btn w-full text-left p-3 rounded-xl bg-sky-600 text-white font-bold flex items-center gap-2.5 transition shadow";
    }

    function initTodayDate() {
      const todayStr = new Date().toISOString().split('T')[0];
      if (!document.getElementById('cbDate').value) {
        document.getElementById('cbDate').value = todayStr;
      }
      loadRecordByDate(document.getElementById('cbDate').value);
    }

    function onDateChange() {
      loadRecordByDate(document.getElementById('cbDate').value);
    }

    function loadRecordByDate(dateStr) {
      const records = appState.contactBooks || [];
      const record = records.find(r => r.date === dateStr);
      const displayEl = document.getElementById('cbContentDisplay');

      if (record) {
        displayEl.innerText = record.content;
      } else {
        displayEl.innerText = `【${dateStr}】 老師尚未發布當日聯絡事項。`;
      }
      checkTodayEvents();
    }

    function checkTodayEvents() {
      const currentDate = document.getElementById('cbDate').value;
      const events = appState.calendarEvents || [];
      const matchedEvents = events.filter(e => e.date === currentDate);
      const eventsBox = document.getElementById('todayEventsBox');
      const eventsList = document.getElementById('todayEventsList');

      if (matchedEvents.length > 0) {
        eventsList.innerHTML = matchedEvents.map(e => `<li>${e.title}</li>`).join('');
        eventsBox.classList.remove('hidden');
      } else {
        eventsBox.classList.add('hidden');
      }
    }

    function renderHistoryList() {
      const listContainer = document.getElementById('cbHistoryList');
      const records = appState.contactBooks || [];
      if (records.length === 0) {
        listContainer.innerHTML = '<p class="text-gray-400 text-sm py-2">目前沒有歷史紀錄</p>';
        return;
      }

      listContainer.innerHTML = records.map(item => `
        <div class="py-3 flex justify-between items-center hover:bg-gray-50 px-2 rounded-xl transition">
          <div>
            <span class="font-extrabold text-blue-600 text-sm">${item.date}</span>
            <p class="text-xs text-gray-500 truncate max-w-xs md:max-w-md mt-0.5">${item.content.replace(/\n/g, ' ')}</p>
          </div>
          <button onclick="selectHistoryDate('${item.date}')" class="text-xs bg-sky-50 hover:bg-sky-100 text-sky-700 font-bold px-3 py-1.5 rounded-lg border border-sky-200 transition shrink-0">📖 查看</button>
        </div>
      `).join('');
    }

    function selectHistoryDate(dateStr) {
      document.getElementById('cbDate').value = dateStr;
      loadRecordByDate(dateStr);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCalendarList() {
      const events = appState.calendarEvents || [];
      document.getElementById('eventCount').innerText = `共 ${events.length} 筆事件`;
      const listContainer = document.getElementById('calendarList');

      if (events.length === 0) {
        listContainer.innerHTML = '<p class="text-gray-400 text-sm py-4 text-center">尚未有行事曆事件。</p>';
        return;
      }

      listContainer.innerHTML = events.map(evt => `
        <div class="py-3.5 flex items-center justify-between hover:bg-gray-50 px-3 rounded-xl transition">
          <div class="flex items-center gap-3">
            <span class="font-extrabold text-amber-800 bg-amber-50 px-3 py-1 rounded-xl border border-amber-200 text-xs shrink-0">${evt.date}</span>
            <span class="font-bold text-gray-800 text-base">${evt.title}</span>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
