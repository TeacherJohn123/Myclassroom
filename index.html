<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級經營工具包 (雲端同步版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .text-5xl-custom {
      font-size: 2.5rem !important;
      line-height: 1.4 !important;
    }
    textarea.auto-expand {
      min-height: 120px;
      resize: vertical;
    }

    /* 📢 專屬公告模式樣式 (?mode=notice) */
    body.notice-readonly .interactive-control,
    body.notice-readonly button:not(.nav-btn),
    body.notice-readonly input,
    body.notice-readonly textarea,
    body.notice-readonly select,
    body.notice-readonly .hide-in-notice {
      display: none !important;
    }
    body.notice-readonly .notice-view-tag {
      display: block !important;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 flex flex-col md:flex-row">

  <aside class="w-full md:w-64 bg-slate-800 text-white md:min-h-screen p-4 flex flex-col justify-between shrink-0">
    <div>
      <h1 class="text-xl font-bold mb-2 flex items-center gap-2">🏫 班級公告欄</h1>
      
      <div class="notice-view-tag hidden bg-sky-500/20 border border-sky-400/40 text-sky-200 text-xs px-2.5 py-1 rounded mb-4 font-bold">
        📢 每日聯絡簿與行事曆公告
      </div>

      <nav class="flex overflow-x-auto gap-2 md:flex-col md:space-y-2 md:gap-0 pb-2 md:pb-0 scrollbar-hide" id="sidebar-nav">
        <button onclick="switchTab('contactbook')" id="btn-contactbook" class="nav-btn whitespace-nowrap w-auto md:w-full text-left p-2.5 rounded-lg bg-slate-700 font-bold flex items-center gap-2">📖 每日聯絡簿</button>
        <button onclick="switchTab('attendance')" id="btn-attendance" class="nav-btn hide-in-notice whitespace-nowrap w-auto md:w-full text-left p-2.5 rounded-lg hover:bg-slate-700 flex items-center gap-2">⏱️ 請假遲到</button>
        <button onclick="switchTab('todo')" id="btn-todo" class="nav-btn hide-in-notice whitespace-nowrap w-auto md:w-full text-left p-2.5 rounded-lg hover:bg-slate-700 flex items-center gap-2">📝 未完成工作</button>
        <button onclick="switchTab('points')" id="btn-points" class="nav-btn hide-in-notice whitespace-nowrap w-auto md:w-full text-left p-2.5 rounded-lg hover:bg-slate-700 flex items-center gap-2">🏆 榮譽點數</button>
        <button onclick="switchTab('corridor')" id="btn-corridor" class="nav-btn hide-in-notice whitespace-nowrap w-auto md:w-full text-left p-2.5 rounded-lg hover:bg-slate-700 flex items-center gap-2">🏃 走廊奔跑</button>
        
        <button onclick="switchTab('publications')" id="btn-publications" class="nav-btn hide-in-notice whitespace-nowrap w-auto md:w-full text-left p-2.5 rounded-lg hover:bg-slate-700 flex items-center gap-2">✍️ 專刊與繕寫</button>

        <button onclick="switchTab('calendar')" id="btn-calendar" class="nav-btn whitespace-nowrap w-auto md:w-full text-left p-2.5 rounded-lg hover:bg-slate-700 flex items-center gap-2">📅 班級行事曆</button>
        <button onclick="switchTab('seating')" id="btn-seating" class="nav-btn hide-in-notice whitespace-nowrap w-auto md:w-full text-left p-2.5 rounded-lg hover:bg-slate-700 flex items-center gap-2">🪑 班級座位</button>
        <button onclick="switchTab('students')" id="btn-students" class="nav-btn hide-in-notice whitespace-nowrap w-auto md:w-full text-left p-2.5 rounded-lg hover:bg-slate-700 flex items-center gap-2">👨‍🎓 學生名單</button>
      </nav>
    </div>
    <div class="text-xs text-slate-400 border-t border-slate-700 pt-3">雲端同步模組 v4.31 (專刊歷程優化版)</div>
  </aside>

  <main class="flex-1 p-6 overflow-y-auto">
    
    <section id="tab-contactbook" class="tab-content active space-y-6">
      <h2 class="text-2xl font-bold border-b pb-2 text-slate-800">📖 每日聯絡簿系統</h2>
      
      <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
        <div class="flex flex-wrap gap-4 items-center mb-6 interactive-control">
          <label class="font-bold text-gray-700 text-lg">日期選擇：</label>
          <input type="date" id="cbDate" onchange="onDateChange()" class="border rounded-lg p-2.5 text-lg font-bold focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50" />
          <button onclick="setTodayDate()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg text-base font-bold transition">
            📅 套用今天日期
          </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div id="todayEventsBox" class="md:col-span-2 p-4 bg-amber-50 border-2 border-amber-300 rounded-xl text-amber-950 hidden">
            <div class="font-bold flex items-center gap-2 mb-2 text-xl">
              <span>📌 當日行事曆事件：</span>
            </div>
            <ul id="todayEventsList" class="list-disc list-inside space-y-1 text-amber-900 font-extrabold text-2xl"></ul>
          </div>

          <div class="md:col-span-1 p-4 bg-sky-50 border-2 border-sky-300 rounded-xl text-sky-950 flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="font-bold text-lg flex items-center gap-1">🧹 值日生：</span>
                <button onclick="openDutyPicker()" class="text-xs bg-sky-600 hover:bg-sky-700 text-white font-bold px-2.5 py-1 rounded transition interactive-control">⚙️ 安排值日生</button>
              </div>
              <div id="dutyStudentsDisplay" class="text-2xl font-extrabold text-sky-900 mb-3 flex flex-wrap gap-2">
                <span class="text-gray-400 text-sm font-normal">未安排值日生</span>
              </div>
            </div>

            <button onclick="openBehaviorModal()" class="w-full bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold py-1.5 px-2 rounded-lg transition shadow-sm flex items-center justify-center gap-1 interactive-control">
              🚨 登記不當行為 (指定值日生)
            </button>
          </div>
        </div>

        <div class="mb-6">
          <label class="block font-bold text-gray-800 text-xl mb-2">聯絡事項與回家作業：</label>
          <textarea id="cbContent" oninput="autoExpandTextarea(this)" class="auto-expand w-full border-2 border-gray-300 rounded-xl p-4 focus:ring
